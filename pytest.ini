[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: fast tests, no TensorFlow, no network
    integration: needs TensorFlow (builds a tiny random model) or runs the Streamlit app headlessly
    live: calls the real Gemini API; skipped unless RUN_LIVE_TESTS=1 and GEMINI_API_KEY are set
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
